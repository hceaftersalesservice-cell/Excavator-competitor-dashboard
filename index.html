<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metro CAT Value Calculator</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, Arial, sans-serif;
}

body{
    background:#f4f4f4;
}

.header{
    background:#202020;
    color:white;
    padding:20px;
    text-align:center;
}

.header h1{
    color:#ffcc00;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

h2{
    margin-bottom:15px;
    color:#202020;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:5px;
}

.btn{
    background:#ffcc00;
    border:none;
    width:100%;
    padding:12px;
    font-weight:bold;
    cursor:pointer;
    border-radius:5px;
}

.btn:hover{
    background:#f7b800;
}

.result{
    margin-top:20px;
    background:#f8f8f8;
    padding:15px;
    border-left:5px solid #ffcc00;
}

.big-number{
    font-size:28px;
    font-weight:bold;
    color:#d62828;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
    gap:20px;
}

.compare-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.compare-box{
    background:#fafafa;
    padding:15px;
    border-radius:10px;
    border:1px solid #ddd;
}

.cat-title{
    color:#ffcc00;
}

.kom-title{
    color:#0066cc;
}

@media(max-width:768px){
    .compare-grid{
        grid-template-columns:1fr;
    }
}

</style>
</head>

<body>

<div class="header">
    <h1>Metro CAT Value Calculator</h1>
    <p>TCO | ROI | Downtime | Comparison Tool</p>
</div>

<div class="container">

<div class="grid">

<!-- TCO -->

<div class="card">

<h2>TCO Calculator</h2>

<label>Purchase Price</label>
<input id="purchase" value="5500000">

<label>Fuel Cost / Year</label>
<input id="fuel" value="1050000">

<label>Maintenance Cost / Year</label>
<input id="maintenance" value="300000">

<label>Downtime Cost / Year</label>
<input id="downtime" value="100000">

<label>Years</label>
<input id="years" value="5">

<label>Resale Value</label>
<input id="resale" value="2500000">

<button class="btn" onclick="calculateTCO()">
Calculate TCO
</button>

<div class="result">

<p>Total Cost of Ownership</p>

<div class="big-number" id="tcoResult">
-
</div>

<br>

<p>Cost Per Hour</p>

<div class="big-number" id="hourResult">
-
</div>

</div>

</div>

<!-- ROI -->

<div class="card">

<h2>ROI Calculator</h2>

<label>Additional Investment</label>
<input id="investment" value="500000">

<label>Fuel Saving</label>
<input id="savingFuel" value="140000">

<label>Downtime Saving</label>
<input id="savingDown" value="100000">

<label>Resale Advantage</label>
<input id="savingResale" value="300000">

<button class="btn" onclick="calculateROI()">
Calculate ROI
</button>

<div class="result">

<p>ROI Result</p>

<div class="big-number" id="roiResult">
-
</div>

</div>

</div>

<!-- DOWNTIME -->

<div class="card">

<h2>Downtime Calculator</h2>

<label>Revenue Per Day</label>
<input id="revenue" value="20000">

<label>Downtime Days</label>
<input id="days" value="5">

<button class="btn" onclick="calculateDowntime()">
Calculate Downtime Cost
</button>

<div class="result">

<p>Opportunity Loss</p>

<div class="big-number" id="downtimeResult">
-
</div>

</div>

</div>

</div>

<!-- MACHINE COMPARISON -->

<div class="card">

<h2>CAT vs Komatsu Comparison</h2>

<div class="compare-grid">

<div class="compare-box">

<h3 class="cat-title">
CAT 320
</h3>

<label>Purchase Price</label>
<input id="catPrice" value="5500000">

<label>Fuel Cost / Year</label>
<input id="catFuel" value="1050000">

<label>Maintenance / Year</label>
<input id="catMaintenance" value="300000">

<label>Downtime / Year</label>
<input id="catDowntime" value="100000">

<label>Resale Value</label>
<input id="catResale" value="2500000">

</div>

<div class="compare-box">

<h3 class="kom-title">
Komatsu PC210
</h3>

<label>Purchase Price</label>
<input id="komPrice" value="5000000">

<label>Fuel Cost / Year</label>
<input id="komFuel" value="1150000">

<label>Maintenance / Year</label>
<input id="komMaintenance" value="350000">

<label>Downtime / Year</label>
<input id="komDowntime" value="150000">

<label>Resale Value</label>
<input id="komResale" value="2000000">

</div>

</div>

<br>

<button class="btn" onclick="compareMachine()">
Compare Machines
</button>

<div class="result">

<div id="compareResult">
-
</div>

</div>

</div>

</div>

<script>

function money(value){
    return Number(value).toLocaleString('en-US',{
        maximumFractionDigits:0
    });
}

function calculateTCO(){

let purchase =
parseFloat(document.getElementById("purchase").value);

let fuel =
parseFloat(document.getElementById("fuel").value);

let maintenance =
parseFloat(document.getElementById("maintenance").value);

let downtime =
parseFloat(document.getElementById("downtime").value);

let years =
parseFloat(document.getElementById("years").value);

let resale =
parseFloat(document.getElementById("resale").value);

let tco =
purchase +
((fuel + maintenance + downtime) * years)
- resale;

let costHour =
tco / (years * 2000);

document.getElementById("tcoResult").innerHTML =
money(tco) + " THB";

document.getElementById("hourResult").innerHTML =
money(costHour) + " THB/hr";

}

function calculateROI(){

let investment =
parseFloat(document.getElementById("investment").value);

let fuel =
parseFloat(document.getElementById("savingFuel").value);

let down =
parseFloat(document.getElementById("savingDown").value);

let resale =
parseFloat(document.getElementById("savingResale").value);

let benefit =
fuel + down + resale;

let roi =
((benefit - investment)/investment) * 100;

document.getElementById("roiResult").innerHTML =
roi.toFixed(1) + "%";

}

function calculateDowntime(){

let revenue =
parseFloat(document.getElementById("revenue").value);

let days =
parseFloat(document.getElementById("days").value);

let cost =
revenue * days;

document.getElementById("downtimeResult").innerHTML =
money(cost) + " THB";

}

function compareMachine(){

let years = 5;

let catTCO =
parseFloat(catPrice.value)
+
(
parseFloat(catFuel.value)
+
parseFloat(catMaintenance.value)
+
parseFloat(catDowntime.value)
) * years
-
parseFloat(catResale.value);

let komTCO =
parseFloat(komPrice.value)
+
(
parseFloat(komFuel.value)
+
parseFloat(komMaintenance.value)
+
parseFloat(komDowntime.value)
) * years
-
parseFloat(komResale.value);

let winner = "";

if(catTCO < komTCO){
    winner =
    "<span style='color:green;font-size:24px'>✅ CAT 320 has lower Total Cost of Ownership</span>";
}else{
    winner =
    "<span style='color:green;font-size:24px'>✅ Komatsu PC210 has lower Total Cost of Ownership</span>";
}

document.getElementById("compareResult").innerHTML =

`
<h3>Comparison Summary</h3>

<p><b>CAT 320 TCO :</b> ${money(catTCO)} THB</p>

<br>

<p><b>Komatsu PC210 TCO :</b> ${money(komTCO)} THB</p>

<br>

<p><b>Difference :</b> ${money(Math.abs(catTCO-komTCO))} THB</p>

<br>

${winner}
`;

}

calculateTCO();
calculateROI();
calculateDowntime();
compareMachine();

</script>

</body>
</html>
